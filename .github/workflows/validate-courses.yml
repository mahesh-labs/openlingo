name: Validate Community Courses & Pipeline

on:
  pull_request:
    paths:
      - 'courses/**'
      - 'scripts/sync-course-pipeline.py'
      - 'android/AndroidManifest.xml'
      - 'sw.js'
  push:
    branches: [main]
    paths:
      - 'courses/**'
      - 'scripts/sync-course-pipeline.py'

jobs:
  validate-courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all matrix languages, standalone courses, icons, and pipeline sync
        run: python3 scripts/sync-course-pipeline.py --check
