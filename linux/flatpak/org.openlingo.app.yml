app-id: org.openlingo.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: openlingo
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: openlingo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/openlingo/www
      - cp index.html privacy.html styles.css app.js sw.js manifest.webmanifest /app/share/openlingo/www/
      - cp -r src courses assets /app/share/openlingo/www/
      - install -Dm755 linux/openlingo-desktop.py /app/share/openlingo/openlingo-desktop.py
      - printf '#!/bin/sh\nexec python3 /app/share/openlingo/openlingo-desktop.py "$@"\n' > /app/bin/openlingo
      - chmod +x /app/bin/openlingo
      - install -Dm644 linux/org.openlingo.app.desktop /app/share/applications/org.openlingo.app.desktop
      - install -Dm644 linux/flatpak/org.openlingo.app.metainfo.xml /app/share/metainfo/org.openlingo.app.metainfo.xml
      - install -Dm644 assets/icons/openlingo-icon.svg /app/share/icons/hicolor/scalable/apps/org.openlingo.app.svg
      - install -Dm644 assets/icons/openlingo-256.png /app/share/icons/hicolor/256x256/apps/org.openlingo.app.png
      - install -Dm644 assets/icons/openlingo-512.png /app/share/icons/hicolor/512x512/apps/org.openlingo.app.png
    sources:
      - type: dir
        path: ../..
